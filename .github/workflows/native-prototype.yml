name: Build native prototype
on:
  workflow_dispatch:
  push:
    branches: [main, 'arena/**']
    paths: ['native-prototype/**', '.github/workflows/native-prototype.yml']
  pull_request:
    paths: ['native-prototype/**', '.github/workflows/native-prototype.yml']
permissions:
  contents: read
  actions: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Godot and export templates
        shell: bash
        run: |
          set -euxo pipefail
          version=4.4.1-stable
          base=https://github.com/godotengine/godot-builds/releases/download/$version
          wget -q "$base/Godot_v${version}_linux.x86_64.zip" -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install /tmp/godot/Godot_v${version}_linux.x86_64 /usr/local/bin/godot
          wget -q "$base/Godot_v${version}_export_templates.tpz" -O /tmp/templates.zip
          mkdir -p "$HOME/.local/share/godot/export_templates/${version/-/.}"
          unzip -q /tmp/templates.zip -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/${version/-/.}/"
      - name: Configure Android SDK and debug signing
        shell: bash
        run: |
          set -euxo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -keysize 2048 -validity 10000
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<SETTINGS
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          SETTINGS
      # Reuse the exact custom Godot Windows engine the user reported stable.
      # Only the small stripped EXE is cached/distributed, not debug symbols.
      - name: Cache Windows engine template
        id: windows-engine-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/wmc-windows-engine
          key: wmc-windows-godot-4.4.1-mingw-debug-template-v1
      - name: Seed template from tested diagnostic build
        id: seed-template
        if: steps.windows-engine-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: WMC-Windows-symbolized-diagnostic
          run-id: 43554812651
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/wmc-diagnostic-seed
      - name: Prepare tested Windows engine
        if: steps.windows-engine-cache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.cache/wmc-windows-engine"
          if [ -s /tmp/wmc-diagnostic-seed/WMC.exe ]; then
            cp /tmp/wmc-diagnostic-seed/WMC.exe "$HOME/.cache/wmc-windows-engine/WMC.exe"
            rm -rf /tmp/wmc-diagnostic-seed
          else
            # Artifact/cache expiry must not silently revert to the old engine.
            sudo apt-get update -qq
            sudo apt-get install -y -qq g++-mingw-w64-x86-64-posix scons
            sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
            sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
            curl -L --retry 3 https://codeload.github.com/godotengine/godot/tar.gz/refs/tags/4.4.1-stable -o /tmp/wmc-godot-source.tar.gz
            mkdir -p /tmp/wmc-godot-source
            tar -xf /tmp/wmc-godot-source.tar.gz --strip-components=1 -C /tmp/wmc-godot-source
            (cd /tmp/wmc-godot-source && scons platform=windows target=template_debug arch=x86_64 use_mingw=yes use_static_cpp=yes debug_symbols=yes separate_debug_symbols=yes -j4)
            cp /tmp/wmc-godot-source/bin/godot.windows.template_debug.x86_64.exe "$HOME/.cache/wmc-windows-engine/WMC.exe"
          fi
      - name: Import and test project
        run: |
          set -o pipefail
          godot --headless --editor --path native-prototype --import 2>&1 | tee /tmp/godot-import.log
          godot --headless --path native-prototype --quit-after 5 2>&1 | tee /tmp/godot-run.log
          if ! godot --headless --path native-prototype --script res://smoke.gd > /tmp/godot-smoke.log 2>&1; then
            echo "::error::SMOKE LOG BASE64 $(base64 -w0 /tmp/godot-smoke.log)"
            exit 1
          fi
          if ! godot --headless --path native-prototype --script res://race_smoke.gd > /tmp/godot-race-smoke.log 2>&1; then
            echo "::error::RACE LOG BASE64 $(base64 -w0 /tmp/godot-race-smoke.log)"
            exit 1
          fi
          if ! godot --headless --path native-prototype --script res://replay_stress.gd > /tmp/godot-replay-stress.log 2>&1; then
            echo "::error::REPLAY STRESS LOG BASE64 $(base64 -w0 /tmp/godot-replay-stress.log)"
            exit 1
          fi
          cat /tmp/godot-replay-stress.log >> /tmp/godot-run.log
          cat /tmp/godot-race-smoke.log >> /tmp/godot-run.log
          cat /tmp/godot-smoke.log >> /tmp/godot-run.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' /tmp/godot-import.log /tmp/godot-run.log; then
            while IFS= read -r line; do echo "::error::$line"; done < <(grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' /tmp/godot-import.log /tmp/godot-run.log)
            exit 1
          fi
      - name: Test rendered race and real viewport capture
        run: |
          set -o pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri
          if ! LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a godot --rendering-method gl_compatibility --path native-prototype --script res://render_race_smoke.gd > /tmp/godot-render-test.log 2>&1; then
            echo "::error::RENDER TEST LOG BASE64 $(base64 -w0 /tmp/godot-render-test.log)"
            exit 1
          fi
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' /tmp/godot-render-test.log; then
            echo "::error::RENDER TEST LOG BASE64 $(base64 -w0 /tmp/godot-render-test.log)"
            exit 1
          fi
      - name: Export Windows and Android debug builds
        run: |
          mkdir -p native-prototype/build
          set -o pipefail
          cp "$HOME/.cache/wmc-windows-engine/WMC.exe" native-prototype/build/WMC.exe
          godot --headless --path native-prototype --export-pack Windows "$GITHUB_WORKSPACE/native-prototype/build/WMC.pck"
          if ! godot --headless --path native-prototype --export-debug Android "build/WMC.apk" > /tmp/export.log 2>&1; then
            echo "::error::ANDROID EXPORT LOG BASE64 $(base64 -w0 /tmp/export.log)"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: WMC-Windows
          path: |
            native-prototype/build/WMC.exe
            native-prototype/build/WMC.pck
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: WMC-Android
          path: native-prototype/build/WMC.apk
          if-no-files-found: error
