name: Build native prototype
on:
  workflow_dispatch:
  push:
    branches: [main, 'arena/**']
    paths: ['native-prototype/**', '.github/workflows/native-prototype.yml']
  pull_request:
    paths: ['native-prototype/**', '.github/workflows/native-prototype.yml']
permissions:
  contents: read
  actions: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Godot and export templates
        shell: bash
        run: |
          set -euxo pipefail
          version=4.4.1-stable
          base=https://github.com/godotengine/godot-builds/releases/download/$version
          wget -q "$base/Godot_v${version}_linux.x86_64.zip" -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install /tmp/godot/Godot_v${version}_linux.x86_64 /usr/local/bin/godot
          wget -q "$base/Godot_v${version}_export_templates.tpz" -O /tmp/templates.zip
          mkdir -p "$HOME/.local/share/godot/export_templates/${version/-/.}"
          unzip -q /tmp/templates.zip -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/${version/-/.}/"
      - name: Configure Android SDK and debug signing
        shell: bash
        run: |
          set -euxo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -keysize 2048 -validity 10000
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<SETTINGS
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          SETTINGS
      # The previous custom template omitted ANGLE, forcing affected Intel GPUs
      # onto native OpenGL. Use the same ANGLE release as Godot 4.4.1 CI.
      - name: Cache ANGLE-enabled Windows engine
        id: windows-engine-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/wmc-windows-engine-angle
          key: wmc-windows-godot-4.4.1-mingw-debug-angle-canvas-subdata-trace-v1
      - name: Build Windows engine with ANGLE
        if: steps.windows-engine-cache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++-mingw-w64-x86-64-posix scons
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
          curl -L --retry 3 https://codeload.github.com/godotengine/godot/tar.gz/refs/tags/4.4.1-stable -o /tmp/wmc-godot-source.tar.gz
          mkdir -p /tmp/wmc-godot-source /tmp/wmc-angle "$HOME/.cache/wmc-windows-engine-angle"
          tar -xf /tmp/wmc-godot-source.tar.gz --strip-components=1 -C /tmp/wmc-godot-source
          wget -q 'https://github.com/godotengine/godot-angle-static/releases/download/chromium/6601.2/godot-angle-static-x86_64-gcc-release.zip' -O /tmp/wmc-angle.zip
          unzip -q /tmp/wmc-angle.zip -d /tmp/wmc-angle
          test -f /tmp/wmc-angle/libANGLE.windows.x86_64.a
          python3 native-prototype/tools/patch_canvas_upload.py /tmp/wmc-godot-source
          python3 native-prototype/tools/patch_crash_trace.py /tmp/wmc-godot-source
          (cd /tmp/wmc-godot-source && scons platform=windows target=template_debug arch=x86_64 use_mingw=yes use_static_cpp=yes debug_symbols=yes separate_debug_symbols=yes angle_libs=/tmp/wmc-angle -j4)
          cp /tmp/wmc-godot-source/bin/godot.windows.template_debug.x86_64.exe "$HOME/.cache/wmc-windows-engine-angle/WMC.exe"
          cp /tmp/wmc-godot-source/bin/godot.windows.template_debug.x86_64.exe.debugsymbols "$HOME/.cache/wmc-windows-engine-angle/WMC.exe.debugsymbols"
      - name: Check ANGLE is statically linked
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          data = (Path.home() / '.cache/wmc-windows-engine-angle/WMC.exe').read_bytes()
          assert b'drivers seem not to support GLES3 / ANGLE, switching to native OpenGL' in data
          assert b'ANGLE dynamic libraries (libEGL.dll and libGLESv2.dll) are missing' not in data
          PYCODE
      - name: Verify AI model hierarchy, textures and triangle reduction
        run: python3 native-prototype/tools/check_ai_models.py
      - name: Import and test project
        run: |
          set -o pipefail
          godot --headless --editor --path native-prototype --import 2>&1 | tee /tmp/godot-import.log
          godot --headless --path native-prototype --quit-after 5 2>&1 | tee /tmp/godot-run.log
          if ! godot --headless --path native-prototype --script res://smoke.gd > /tmp/godot-smoke.log 2>&1; then
            echo "::error::SMOKE LOG BASE64 $(base64 -w0 /tmp/godot-smoke.log)"
            exit 1
          fi
          if ! godot --headless --path native-prototype --script res://race_smoke.gd > /tmp/godot-race-smoke.log 2>&1; then
            echo "::error::RACE LOG BASE64 $(base64 -w0 /tmp/godot-race-smoke.log)"
            exit 1
          fi
          if ! godot --headless --path native-prototype --script res://replay_stress.gd > /tmp/godot-replay-stress.log 2>&1; then
            echo "::error::REPLAY STRESS LOG BASE64 $(base64 -w0 /tmp/godot-replay-stress.log)"
            exit 1
          fi
          cat /tmp/godot-replay-stress.log >> /tmp/godot-run.log
          cat /tmp/godot-race-smoke.log >> /tmp/godot-run.log
          cat /tmp/godot-smoke.log >> /tmp/godot-run.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' /tmp/godot-import.log /tmp/godot-run.log; then
            while IFS= read -r line; do echo "::error::$line"; done < <(grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' /tmp/godot-import.log /tmp/godot-run.log)
            exit 1
          fi
      - name: Test rendered race and real viewport capture
        run: |
          set -o pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri
          if ! LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a godot --rendering-method gl_compatibility --path native-prototype --script res://render_race_smoke.gd > /tmp/godot-render-test.log 2>&1; then
            echo "::error::RENDER TEST LOG BASE64 $(base64 -w0 /tmp/godot-render-test.log)"
            exit 1
          fi
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' /tmp/godot-render-test.log; then
            echo "::error::RENDER TEST LOG BASE64 $(base64 -w0 /tmp/godot-render-test.log)"
            exit 1
          fi
      - name: Export Windows and Android debug builds
        run: |
          mkdir -p native-prototype/build
          set -o pipefail
          cp "$HOME/.cache/wmc-windows-engine-angle/WMC.exe" native-prototype/build/WMC.exe
          godot --headless --path native-prototype --export-pack Windows "$GITHUB_WORKSPACE/native-prototype/build/WMC.pck"
          if ! godot --headless --path native-prototype --export-debug Android "build/WMC.apk" > /tmp/export.log 2>&1; then
            echo "::error::ANDROID EXPORT LOG BASE64 $(base64 -w0 /tmp/export.log)"
            exit 1
          fi
      - name: Test patched Windows renderer with real race and capture
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq wine64 xvfb libgl1-mesa-dri
          export WINEDEBUG=-all LIBGL_ALWAYS_SOFTWARE=1 WINEPREFIX="$HOME/.wmc-wine"
          if ! timeout 180s xvfb-run -a wine "$GITHUB_WORKSPACE/native-prototype/build/WMC.exe" --main-pack "Z:$GITHUB_WORKSPACE/native-prototype/build/WMC.pck" --rendering-driver opengl3 --script res://render_race_smoke.gd --audio-driver Dummy > /tmp/wmc-windows-test.log 2>&1; then
            echo "::error::WINDOWS RENDER TEST BASE64 $(tail -80 /tmp/wmc-windows-test.log | base64 -w0)"
            exit 1
          fi
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script|CrashHandlerException' /tmp/wmc-windows-test.log; then
            echo "::error::WINDOWS RENDER TEST BASE64 $(tail -80 /tmp/wmc-windows-test.log | base64 -w0)"
            exit 1
          fi
      - name: Identify matching engine symbols
        run: |
          mkdir -p /tmp/wmc-engine-symbols
          cp "$HOME/.cache/wmc-windows-engine-angle/WMC.exe.debugsymbols" /tmp/wmc-engine-symbols/
          sha256sum native-prototype/build/WMC.exe | tee /tmp/wmc-engine-symbols/BUILD-SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: WMC-Windows-engine-symbols
          path: /tmp/wmc-engine-symbols/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: WMC-Windows
          path: |
            native-prototype/build/WMC.exe
            native-prototype/build/WMC.pck
          if-no-files-found: error
      - name: Prepare controlled AI comparison
        run: |
          mkdir -p /tmp/wmc-ai-comparison
          cp native-prototype/build/WMC.exe native-prototype/build/WMC.pck /tmp/wmc-ai-comparison/
          cp native-prototype/diagnostic-launchers/* /tmp/wmc-ai-comparison/
      - uses: actions/upload-artifact@v4
        with:
          name: WMC-AI-render-comparison
          path: /tmp/wmc-ai-comparison/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: WMC-Android
          path: native-prototype/build/WMC.apk
          if-no-files-found: error
