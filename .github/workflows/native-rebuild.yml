name: Native rebuild validation
on:
  push:
    branches: ['arena/**']
    paths: ['native-rebuild/**', '.github/workflows/native-rebuild.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.4.1
        run: |
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 /usr/local/bin/godot
      - name: Source and runtime tests
        run: |
          set -euo pipefail
          python3 native-rebuild/tests/validate_project.py
          if ! timeout 150s godot --headless --editor --path native-rebuild --import > /tmp/import.log 2>&1; then
            echo "::error::Import log base64 $(tail -100 /tmp/import.log | base64 -w0)"
            exit 1
          fi
          cat /tmp/import.log
          if ! timeout 20s godot --verbose --headless --path native-rebuild --script res://tests/race_view.gd > /tmp/test.log 2>&1; then
            echo "::error::Runtime test log base64 $(head -100 /tmp/test.log | base64 -w0)"
            exit 1
          fi
          cat /tmp/test.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script|Assertion failed' /tmp/import.log /tmp/test.log || grep -E 'ERROR:' /tmp/test.log; then
            echo "::error::Import and runtime logs base64 $((grep -E -A 2 'SCRIPT ERROR|Parse Error|Failed to load script|Assertion failed' /tmp/import.log /tmp/test.log; grep -E -A 12 -B 8 'ERROR:' /tmp/test.log || true) | head -20 | base64 -w0)"
            exit 1
          fi
      - name: Verify rendered race footage and winner playback
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri
          if ! timeout 90s xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 godot --rendering-method gl_compatibility --path native-rebuild --script res://tests/render_view.gd --audio-driver Dummy > /tmp/render.log 2>&1; then
            echo "::error::Render test log base64 $(head -100 /tmp/render.log | base64 -w0)"
            exit 1
          fi
          cat /tmp/render.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script|ERROR:' /tmp/render.log; then
            echo "::error::Render test log base64 $(head -100 /tmp/render.log | base64 -w0)"
            exit 1
          fi
  export-windows:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot and templates
        run: |
          set -euo pipefail
          base=https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable
          wget -q "$base/Godot_v4.4.1-stable_linux.x86_64.zip" -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 /usr/local/bin/godot
          wget -q "$base/Godot_v4.4.1-stable_export_templates.tpz" -O /tmp/templates.zip
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          unzip -q /tmp/templates.zip -d /tmp/templates
          cp -a /tmp/templates/templates/. "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
      - name: Export Windows test build
        run: |
          set -euo pipefail
          godot --headless --editor --path native-rebuild --import
          mkdir -p native-rebuild/build/windows
          godot --headless --path native-rebuild --export-debug 'Windows Desktop' "$GITHUB_WORKSPACE/native-rebuild/build/windows/WMC.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: WMC-rebuild-Windows-test
          path: native-rebuild/build/windows/
          if-no-files-found: error
  export-android:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Godot and templates
        run: |
          set -euo pipefail
          base=https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable
          wget -q "$base/Godot_v4.4.1-stable_linux.x86_64.zip" -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 /usr/local/bin/godot
          wget -q "$base/Godot_v4.4.1-stable_export_templates.tpz" -O /tmp/templates.zip
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          unzip -q /tmp/templates.zip -d /tmp/templates
          cp -a /tmp/templates/templates/. "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
      - name: Configure Android SDK and test signing
        run: |
          set -euxo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -keysize 2048 -validity 10000
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<SETTINGS
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          SETTINGS
      - name: Export Android test build
        run: |
          set -euo pipefail
          godot --headless --editor --path native-rebuild --import
          mkdir -p native-rebuild/build/android
          godot --headless --path native-rebuild --export-debug Android "$GITHUB_WORKSPACE/native-rebuild/build/android/WMC.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: WMC-rebuild-Android-test
          path: native-rebuild/build/android/WMC.apk
          if-no-files-found: error
