name: Native rebuild validation
on:
  push:
    branches: ['arena/**']
    paths: ['native-rebuild/**', '.github/workflows/native-rebuild.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-rebuild-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.4.1
        run: |
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 /usr/local/bin/godot
      - name: Source and runtime tests
        run: |
          set -euo pipefail
          python3 native-rebuild/tests/validate_project.py
          if ! timeout 150s godot --headless --editor --path native-rebuild --import > /tmp/import.log 2>&1; then
            echo "::error::Import log base64 $(tail -100 /tmp/import.log | base64 -w0)"
            exit 1
          fi
          cat /tmp/import.log
          if ! timeout 45s stdbuf -oL -eL godot --headless --path native-rebuild --script res://tests/race_view.gd > /tmp/test.log 2>&1; then
            echo "::error::Runtime test log base64 $(tail -100 /tmp/test.log | base64 -w0)"
            exit 1
          fi
          cat /tmp/test.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script|Assertion failed' /tmp/import.log /tmp/test.log || grep -E 'ERROR:' /tmp/test.log; then
            echo "::error::Import and runtime logs base64 $((grep -E -A 2 'SCRIPT ERROR|Parse Error|Failed to load script|Assertion failed' /tmp/import.log /tmp/test.log; grep -E -A 12 -B 8 'ERROR:' /tmp/test.log || true) | head -20 | base64 -w0)"
            exit 1
          fi
      - name: Verify rendered race footage and winner playback
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri
          if ! timeout 90s xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 godot --verbose --rendering-method gl_compatibility --path native-rebuild --script res://tests/render_view.gd --audio-driver Dummy > /tmp/render.log 2>&1; then
            echo "::error::Render test log base64 $(tail -100 /tmp/render.log | base64 -w0)"
            exit 1
          fi
          cat /tmp/render.log
          echo "::notice::Race preview base64 $(base64 -w0 /tmp/wmc-rebuild-preview.jpg)"
          for view in results championship winner; do
            echo "::notice::${view} preview base64 $(base64 -w0 /tmp/wmc-preview-${view}.jpg)"
          done
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script|ERROR:' /tmp/render.log; then
            echo "::error::Render test log base64 $(tail -100 /tmp/render.log | base64 -w0)"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: WMC-rebuild-race-screenshot
          path: |
            /tmp/wmc-rebuild-race.png
            /tmp/wmc-rebuild-results.png
            /tmp/wmc-rebuild-championship.png
            /tmp/wmc-rebuild-winner.png
          if-no-files-found: error
  export-windows:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot and templates
        run: |
          set -euo pipefail
          base=https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable
          wget -q "$base/Godot_v4.4.1-stable_linux.x86_64.zip" -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 /usr/local/bin/godot
          wget -q "$base/Godot_v4.4.1-stable_export_templates.tpz" -O /tmp/templates.zip
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          unzip -q /tmp/templates.zip -d /tmp/templates
          cp -a /tmp/templates/templates/. "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
      # Retain the earlier Windows-only canvas upload mitigation and static
      # ANGLE fallback. This addresses the observed crash site, not a proven
      # fix for the separate frozen-display symptom.
      - name: Cache ANGLE-enabled Windows engine
        id: windows-engine-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/wmc-windows-engine-angle
          key: wmc-windows-godot-4.4.1-mingw-debug-angle-canvas-subdata-trace-v1
      - name: Build ANGLE-enabled Windows engine on cache miss
        if: steps.windows-engine-cache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++-mingw-w64-x86-64-posix scons
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
          curl -L --retry 3 https://codeload.github.com/godotengine/godot/tar.gz/refs/tags/4.4.1-stable -o /tmp/wmc-godot-source.tar.gz
          mkdir -p /tmp/wmc-godot-source /tmp/wmc-angle "$HOME/.cache/wmc-windows-engine-angle"
          tar -xf /tmp/wmc-godot-source.tar.gz --strip-components=1 -C /tmp/wmc-godot-source
          wget -q 'https://github.com/godotengine/godot-angle-static/releases/download/chromium/6601.2/godot-angle-static-x86_64-gcc-release.zip' -O /tmp/wmc-angle.zip
          unzip -q /tmp/wmc-angle.zip -d /tmp/wmc-angle
          python3 native-rebuild/tools/patch_canvas_upload.py /tmp/wmc-godot-source
          python3 native-rebuild/tools/patch_crash_trace.py /tmp/wmc-godot-source
          (cd /tmp/wmc-godot-source && scons platform=windows target=template_debug arch=x86_64 use_mingw=yes use_static_cpp=yes debug_symbols=yes separate_debug_symbols=yes angle_libs=/tmp/wmc-angle -j4)
          cp /tmp/wmc-godot-source/bin/godot.windows.template_debug.x86_64.exe "$HOME/.cache/wmc-windows-engine-angle/WMC.exe"
          cp /tmp/wmc-godot-source/bin/godot.windows.template_debug.x86_64.exe.debugsymbols "$HOME/.cache/wmc-windows-engine-angle/WMC.exe.debugsymbols"
      - name: Export Windows test build
        run: |
          set -euo pipefail
          godot --headless --editor --path native-rebuild --import
          mkdir -p native-rebuild/build/windows
          godot --headless --path native-rebuild --export-debug 'Windows Desktop' "$GITHUB_WORKSPACE/native-rebuild/build/windows/WMC.exe"
          test -f native-rebuild/build/windows/WMC.pck
          cp "$HOME/.cache/wmc-windows-engine-angle/WMC.exe" native-rebuild/build/windows/WMC.exe
          python3 - <<'PYCODE'
          from pathlib import Path
          data = Path('native-rebuild/build/windows/WMC.exe').read_bytes()
          assert b'drivers seem not to support GLES3 / ANGLE, switching to native OpenGL' in data
          assert b'ANGLE dynamic libraries (libEGL.dll and libGLESv2.dll) are missing' not in data
          PYCODE
          mkdir -p /tmp/wmc-rebuild-symbols
          cp "$HOME/.cache/wmc-windows-engine-angle/WMC.exe.debugsymbols" /tmp/wmc-rebuild-symbols/
          sha256sum native-rebuild/build/windows/WMC.exe > /tmp/wmc-rebuild-symbols/BUILD-SHA256.txt
      - name: Test patched Windows engine under Wine
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq wine64 xvfb libgl1-mesa-dri
          export WINEDEBUG=-all LIBGL_ALWAYS_SOFTWARE=1 WINEPREFIX="$HOME/.wmc-rebuild-wine"
          if ! timeout 120s xvfb-run -a wine "$GITHUB_WORKSPACE/native-rebuild/build/windows/WMC.exe" --main-pack "Z:$GITHUB_WORKSPACE/native-rebuild/build/windows/WMC.pck" --script res://tests/windows_render.gd --audio-driver Dummy > /tmp/windows.log 2>&1; then
            echo "::error::Windows test base64 $(head -60 /tmp/windows.log | base64 -w0)"
            exit 1
          fi
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script|CrashHandlerException|Assertion failed|ERROR:' /tmp/windows.log; then
            echo "::error::Windows test base64 $(head -60 /tmp/windows.log | base64 -w0)"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: WMC-rebuild-Windows-symbols
          path: /tmp/wmc-rebuild-symbols/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: WMC-rebuild-Windows-test
          path: native-rebuild/build/windows/
          if-no-files-found: error
  export-android:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Godot and templates
        run: |
          set -euo pipefail
          base=https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable
          wget -q "$base/Godot_v4.4.1-stable_linux.x86_64.zip" -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 /usr/local/bin/godot
          wget -q "$base/Godot_v4.4.1-stable_export_templates.tpz" -O /tmp/templates.zip
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          unzip -q /tmp/templates.zip -d /tmp/templates
          cp -a /tmp/templates/templates/. "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
      - name: Configure Android SDK and test signing
        run: |
          set -euxo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -keysize 2048 -validity 10000
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<SETTINGS
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          SETTINGS
      - name: Export Android test build
        run: |
          set -euo pipefail
          godot --headless --editor --path native-rebuild --import
          mkdir -p native-rebuild/build/android
          godot --headless --path native-rebuild --export-debug Android "$GITHUB_WORKSPACE/native-rebuild/build/android/WMC.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: WMC-rebuild-Android-test
          path: native-rebuild/build/android/WMC.apk
          if-no-files-found: error
